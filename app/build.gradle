plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flashgo.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.flashgo.browser"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
